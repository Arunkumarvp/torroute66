#!/usr/sbin/nft -f
# PQVeil-TEE Fail-Closed Firewall Policy
#
# Forces all TCP traffic through Tor TransPort (9040),
# all DNS lookups through Tor DNSPort (5353),
# and drops all non-Tor egress (preventing IP/DNS leaks).

flush ruleset

table inet torroute {
  chain prerouting {
    type nat hook prerouting priority -100; policy accept;
  }

  chain out_nat {
    type nat hook output priority -100; policy accept;

    # Allow debian-tor daemon traffic to reach the outer internet directly
    meta skuid "debian-tor" return

    # Allow local loopback communication
    oifname "lo" return

    # Redirect all UDP DNS traffic to Tor's virtual DNS port
    udp dport 53 redirect to :5353

    # Redirect new TCP connections to Tor's transparent proxy port
    tcp flags syn / syn,ack,rst redirect to :9040
  }

  chain filter_out {
    type filter hook output priority 0; policy drop;

    # Allow established connections and loopback
    ct state established,related accept
    oifname "lo" accept

    # Allow the Tor process itself to initiate network connections
    meta skuid "debian-tor" accept

    # Allow packets redirected to local ports
    tcp dport { 9040, 9050, 9051 } accept
    udp dport 5353 accept

    # Drop everything else (default policy drop)
  }
}

