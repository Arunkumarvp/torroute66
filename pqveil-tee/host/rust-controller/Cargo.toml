[package]
name = "pqveil-controller"
version = "0.1.0"
edition = "2021"
authors = ["PQVeil Team"]
description = "PQVeil TEE Normal-World Host Controller"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = "0.8"

